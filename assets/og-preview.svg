<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="40%" stop-color="#0B0F19"/>
      <stop offset="80%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="ogBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="ogTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="ogCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Radial Nebula Glows -->
    <radialGradient id="ogNebulaCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ogNebulaPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Ambient Glow Circles -->
  <rect width="1200" height="630" fill="url(#ogNebulaCyan)"/>
  <rect width="1200" height="630" fill="url(#ogNebulaPurple)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="url(#ogBorder)" stroke-width="2"/>

  <!-- Subtle Grid Accent -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 100)">
    <rect width="320" height="38" rx="19" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#06B6D4" filter="url(#ogGlow)"/>
    <text x="36" y="24" fill="#22D3EE" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">GOOGLE ANTIGRAVITY 2.0</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 210)">
    <text fill="url(#ogTitleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">Oh-My-Antigravity</text>
  </g>

  <!-- Tagline / Subtitle -->
  <g transform="translate(100, 275)">
    <text fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">Multi-Agent Orchestration Harness for Production Engineering</text>
  </g>

  <!-- Feature Pillar Badges -->
  <g transform="translate(100, 350)">
    <!-- Badge 1: 11 Agents -->
    <g transform="translate(0, 0)">
      <rect width="210" height="52" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
      <text x="24" y="32" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">11 Agent Personas</text>
    </g>

    <!-- Badge 2: 47 Skills -->
    <g transform="translate(230, 0)">
      <rect width="210" height="52" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
      <text x="24" y="32" fill="#818CF8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">47 Turnkey Skills</text>
    </g>

    <!-- Badge 3: 5 Hook Phases -->
    <g transform="translate(460, 0)">
      <rect width="230" height="52" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>
      <text x="24" y="32" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">5-Phase Hook Engine</text>
    </g>

    <!-- Badge 4: Zero Overhead -->
    <g transform="translate(710, 0)">
      <rect width="230" height="52" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
      <text x="24" y="32" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">0 Pip Overhead</text>
    </g>
  </g>

  <!-- Terminal Installation Box -->
  <g transform="translate(100, 445)">
    <rect width="1000" height="85" rx="14" fill="#060913" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <circle cx="30" cy="42" r="6" fill="#EF4444"/>
    <circle cx="50" cy="42" r="6" fill="#F59E0B"/>
    <circle cx="70" cy="42" r="6" fill="#10B981"/>
    <text x="105" y="49" fill="#06B6D4" font-family="ui-monospace, monospace" font-size="18" font-weight="700">$</text>
    <text x="130" y="49" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="18" font-weight="500">agy plugin install https://github.com/HengWeiBin/oh-my-antigravity.git</text>
  </g>

  <!-- Floating Logo Mark (Right Side) -->
  <g transform="translate(930, 110)">
    <circle cx="100" cy="100" r="90" fill="url(#ogNebulaCyan)"/>
    <circle cx="100" cy="100" r="75" fill="rgba(14, 19, 34, 0.7)" stroke="url(#ogBorder)" stroke-width="2"/>
    <!-- Central Star / Diamond Symbol -->
    <path d="M 100 55 L 115 88 L 148 100 L 115 112 L 100 145 L 85 112 L 52 100 L 85 88 Z" fill="url(#ogCyanGrad)"/>
    <circle cx="100" cy="100" r="10" fill="#FFFFFF" filter="url(#ogGlow)"/>
  </g>
</svg>
