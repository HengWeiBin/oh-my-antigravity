<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient: Deep void aesthetic with subtle rich contrast -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="50%" stop-color="#090D17"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>

    <!-- Border Gradient: Cyan to Indigo to Purple -->
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Wing Gradients -->
    <linearGradient id="leftBladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="rightBladeGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Orbital Ring Gradients -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Singularity Radiant Core -->
    <radialGradient id="singularityCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#A5F3FC"/>
      <stop offset="55%" stop-color="#06B6D4"/>
      <stop offset="85%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090D17" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow / Glow Filters -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="coreGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle Container (Ensures crisp rendering in both dark and light UI themes) -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#logoBgGrad)" stroke="url(#logoBorderGrad)" stroke-width="2" filter="url(#logoShadow)"/>

  <!-- Ambient Light Atmosphere -->
  <circle cx="128" cy="128" r="96" fill="url(#ambientCoreGlow)"/>
  <circle cx="128" cy="120" r="60" fill="url(#cyanCoreGlow)"/>

  <!-- Gravitational Wave Field Lines (Concentric Celestial Ripples) -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#6366F1" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 6"/>
  <circle cx="128" cy="128" r="68" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="2 4"/>
  <circle cx="128" cy="128" r="48" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Primary Orbital Ring 1: Tilted -30 deg -->
  <ellipse cx="128" cy="128" rx="84" ry="28" fill="none" stroke="url(#orbitGrad1)" stroke-width="2.5" transform="rotate(-30 128 128)" stroke-opacity="0.85"/>

  <!-- Primary Orbital Ring 2: Tilted +35 deg -->
  <ellipse cx="128" cy="128" rx="84" ry="28" fill="none" stroke="url(#orbitGrad2)" stroke-width="2.5" transform="rotate(35 128 128)" stroke-opacity="0.85"/>

  <!-- Polar Gyroscope Gyro Ring -->
  <ellipse cx="128" cy="128" rx="88" ry="18" fill="none" stroke="#38BDF8" stroke-width="1.2" transform="rotate(84 128 128)" stroke-dasharray="5 3" stroke-opacity="0.4"/>

  <!-- Sub-gravity Propulsion / Levitation Waves -->
  <path d="M 102 182 C 114 174 142 174 154 182" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 110 190 C 118 184 138 184 146 190" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Left Antigravity Blade (Upward Levitation Vector) -->
  <path d="M 122 52 L 72 168 C 70 172 73 175 77 175 L 98 175 C 101 175 104 173 105 170 L 122 128 Z" fill="url(#leftBladeGrad)" filter="url(#logoGlow)"/>

  <!-- Right Antigravity Blade (Upward Levitation Vector) -->
  <path d="M 134 52 L 134 128 L 151 170 C 152 173 155 175 158 175 L 179 175 C 183 175 186 172 184 168 Z" fill="url(#rightBladeGrad)" filter="url(#logoGlow)"/>

  <!-- Floating Apex Energy Focus Shard -->
  <polygon points="128,40 133,54 128,60 123,54" fill="#38BDF8" filter="url(#logoGlow)"/>
  <polygon points="128,44 131,54 128,58 125,54" fill="#FFFFFF"/>

  <!-- Levitating Singularity Core (The Gravitational Heart) -->
  <circle cx="128" cy="122" r="22" fill="url(#ambientCoreGlow)"/>
  <circle cx="128" cy="122" r="14" fill="url(#singularityCore)" filter="url(#coreGlowFilter)"/>
  <circle cx="128" cy="122" r="6" fill="#FFFFFF"/>
  <circle cx="128" cy="122" r="2.5" fill="#A5F3FC"/>

  <!-- Gravitational Horizon Energy Beams -->
  <line x1="88" y1="122" x2="168" y2="122" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" opacity="0.75" filter="url(#logoGlow)"/>
  <line x1="128" y1="84" x2="128" y2="162" stroke="#C084FC" stroke-width="1.5" stroke-linecap="round" opacity="0.6" filter="url(#logoGlow)"/>

  <!-- Orbiting Agent Swarm Nodes -->
  <!-- Cyan Node (Atlas) on Orbit 1 -->
  <circle cx="56" cy="87" r="5" fill="#06B6D4" filter="url(#logoGlow)"/>
  <circle cx="56" cy="87" r="2.2" fill="#FFFFFF"/>

  <!-- Purple Node (Prometheus) on Orbit 2 -->
  <circle cx="197" cy="84" r="5" fill="#A855F7" filter="url(#logoGlow)"/>
  <circle cx="197" cy="84" r="2.2" fill="#FFFFFF"/>

  <!-- Indigo Node (Sisyphus) on Orbit 1 -->
  <circle cx="191" cy="165" r="4" fill="#6366F1" filter="url(#logoGlow)"/>
  <circle cx="191" cy="165" r="1.8" fill="#FFFFFF"/>

  <!-- Electric Cyan Node (Hephaestus) on Orbit 2 -->
  <circle cx="65" cy="167" r="4" fill="#22D3EE" filter="url(#logoGlow)"/>
  <circle cx="65" cy="167" r="1.8" fill="#FFFFFF"/>

  <!-- Polar Orbit Node -->
  <circle cx="140" cy="42" r="3" fill="#38BDF8" filter="url(#logoGlow)"/>
  <circle cx="140" cy="42" r="1.2" fill="#FFFFFF"/>

  <!-- Quantum Micro Sparkles -->
  <circle cx="128" cy="30" r="1.5" fill="#38BDF8" opacity="0.9"/>
  <circle cx="156" cy="42" r="1" fill="#C084FC" opacity="0.7"/>
  <circle cx="100" cy="42" r="1" fill="#38BDF8" opacity="0.7"/>
  <circle cx="182" cy="128" r="1.5" fill="#818CF8" opacity="0.8"/>
  <circle cx="74" cy="128" r="1.5" fill="#06B6D4" opacity="0.8"/>
</svg>
