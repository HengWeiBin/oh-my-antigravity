<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Oh-My-Antigravity</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <div class="bg-ambient-nebula"></div>

  <div class="error-page">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title" id="err-title">Page Not Found / 找不到頁面</h1>
      <p class="error-desc" id="err-desc">The requested resource could not be found. Please check the URL or return to home.<br>您請求的網頁或資源不存在，請確認網址或返回首頁。</p>
      <div class="error-links">
        <a href="./" class="btn btn-primary" id="err-home-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span id="err-home-text">Home / 首頁</span>
        </a>
        <a href="./en/" class="btn btn-secondary">English</a>
        <a href="./zh/" class="btn btn-secondary">繁體中文</a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      try {
        var pref = localStorage.getItem('oma_lang');
        if (!pref) {
          var languages = navigator.languages || [navigator.language || ''];
          for (var i = 0; i < languages.length; i++) {
            var l = (languages[i] || '').toLowerCase();
            if (/^zh\b/.test(l)) {
              pref = 'zh';
              break;
            }
            if (/^en\b/.test(l)) {
              pref = 'en';
              break;
            }
          }
        }
        if (pref === 'zh') {
          document.documentElement.lang = 'zh-Hant';
          document.getElementById('err-title').textContent = '找不到頁面';
          document.getElementById('err-desc').textContent = '您所請求的頁面或路徑不存在。請檢查輸入的網址，或點擊下方按鈕返回首頁。';
          document.getElementById('err-home-text').textContent = '返回首頁';
          document.getElementById('err-home-btn').setAttribute('href', './zh/');
        } else {
          document.getElementById('err-title').textContent = 'Page Not Found';
          document.getElementById('err-desc').textContent = 'The page or resource you requested does not exist. Please check your URL or navigate back to the homepage.';
          document.getElementById('err-home-text').textContent = 'Return to Home';
          document.getElementById('err-home-btn').setAttribute('href', './en/');
        }
      } catch (e) {
        /* fallback */
      }
    })();
  </script>
</body>
</html>
